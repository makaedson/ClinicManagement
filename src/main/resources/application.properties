spring.application.name=clinicmanagement

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:clinicmanagement}?sslmode=${DB_SSLMODE:disable}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Suitable for local development; override with validate when deploying.
spring.jpa.hibernate.ddl-auto=update
